blueprint:
  name: Jablotron F-Link toggle (VirtualHere)
  description: >-
    One toggle for remote F-Link access.
    ON starts the VirtualHere add-on (the panel's USB is shared over the network).
    OFF returns the USB to Home Assistant (an add-on restart rebinds the kernel driver),
    stops the add-on and reloads the Jablotron integration.
    Quickly flipping OFF→ON while USB is being returned is handled (mode restart + state check).
  domain: automation
  source_url: https://github.com/valdaaak/ha-jablotron-flink/blob/main/blueprints/automation/jablotron_flink_toggle.yaml
  input:
    toggle:
      name: Toggle
      description: input_boolean that switches F-Link mode on/off
      selector:
        entity:
          filter:
            - domain: input_boolean
    addon:
      name: VirtualHere add-on
      selector:
        addon:
    jablotron_entry:
      name: Jablotron integration
      description: Config entry of the jablotron100 integration to reload after USB is returned
      selector:
        config_entry:
          integration: jablotron100

mode: restart

triggers:
  - trigger: state
    entity_id: !input toggle
    to:
      - "on"
      - "off"

actions:
  - if:
      - condition: template
        value_template: "{{ trigger.to_state.state == 'on' }}"
    then:
      - action: hassio.addon_start
        data:
          addon: !input addon
    else:
      # Restarting the add-on rebinds USB to the kernel on both start and stop (more reliable than a plain stop)
      - action: hassio.addon_restart
        data:
          addon: !input addon
      - delay: "00:00:06"
      # If the toggle was switched back ON meanwhile, don't kill the freshly started add-on
      - condition: state
        entity_id: !input toggle
        state: "off"
      - action: hassio.addon_stop
        data:
          addon: !input addon
      - delay: "00:00:02"
      - action: homeassistant.reload_config_entry
        data:
          entry_id: !input jablotron_entry
