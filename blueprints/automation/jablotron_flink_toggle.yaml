blueprint:
  name: Jablotron F-Link prepínač (VirtualHere)
  description: >-
    Jeden prepínač pre vzdialený F-Link.
    ON spustí VirtualHere add-on (USB ústredne sa zdieľa cez sieť).
    OFF vráti USB späť do Home Assistantu (reštart add-onu naviaže kernel driver),
    add-on zastaví a znova načíta integráciu Jablotron.
    Rýchle prepnutie OFF→ON počas návratu je ošetrené (mode restart + kontrola stavu).
  domain: automation
  source_url: https://github.com/valdaaak/ha-jablotron-flink/blob/main/blueprints/automation/jablotron_flink_toggle.yaml
  input:
    toggle:
      name: Prepínač
      description: input_boolean, ktorým sa F-Link režim zapína/vypína
      selector:
        entity:
          filter:
            - domain: input_boolean
    addon:
      name: VirtualHere add-on
      selector:
        addon:
    jablotron_entry:
      name: Integrácia Jablotron
      description: Config entry integrácie jablotron100, ktorá sa po návrate znova načíta
      selector:
        config_entry:
          integration: jablotron100

mode: restart

triggers:
  - trigger: state
    entity_id: !input toggle
    to:
      - "on"
      - "off"

actions:
  - if:
      - condition: template
        value_template: "{{ trigger.to_state.state == 'on' }}"
    then:
      - action: hassio.addon_start
        data:
          addon: !input addon
    else:
      # Reštart add-onu = pri štarte aj stope sa USB naviaže späť na kernel (spoľahlivejšie ako samotný stop)
      - action: hassio.addon_restart
        data:
          addon: !input addon
      - delay: "00:00:06"
      # Ak je prepínač medzitým zase ON, nezabíjaj čerstvo spustený add-on
      - condition: state
        entity_id: !input toggle
        state: "off"
      - action: hassio.addon_stop
        data:
          addon: !input addon
      - delay: "00:00:02"
      - action: homeassistant.reload_config_entry
        data:
          entry_id: !input jablotron_entry
